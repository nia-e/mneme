[package]
license.workspace = true
name = "mneme-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29"
mneme-mcp-client = { path = "../mneme-mcp-client" }
serde_json = "1"
tokio = { workspace = true, features = ["sync", "time", "signal"] }

chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Mio's edge-triggered source can strand input after its first 1024-byte read.
# Use the existing level-triggered source on Linux; app probes must be positive.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
