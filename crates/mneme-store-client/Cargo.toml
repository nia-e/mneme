[package]
name = "mneme-store-client"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
mneme-config = { path = "../mneme-config" }
mneme-app.workspace = true
mneme-core.workspace = true
ulid.workspace = true
mneme-library = { path = "../mneme-library", default-features = false }
mneme-mcp-client = { path = "../mneme-mcp-client" }
serde.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["time", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
toml = "0.8"
