[package]
license.workspace = true
name = "mneme-mcp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mneme-mcp"
path = "src/main.rs"

[dependencies]
mneme-core.workspace = true
mneme-engine.workspace = true
mneme-app.workspace = true
mneme-cozo.workspace = true
mneme-embed.workspace = true
mneme-body.workspace = true
mneme-walk.workspace = true
mneme-store-path.workspace = true
mneme-present.workspace = true
mneme-mcp-client = { path = "../mneme-mcp-client" }
url.workspace = true
mneme-library = { path = "../mneme-library", default-features = false }
ulid.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "sync", "net", "time"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
# The HTTP (Streamable HTTP) transport — opt-in so the default stdio build stays lean.
axum = { version = "0.7", optional = true }

[target.'cfg(unix)'.dependencies]
# To redirect fd 1 -> fd 2 at startup so library scribbling (ONNX Runtime, progress
# bars) can't corrupt the stdio JSON-RPC stream; protocol writes go to a saved dup.
libc = "0.2"

[features]
# Match mnemed: persistent cozo + real embeddings by default. `--no-default-features`
# gives the dependency-free reference build (JSON snapshot + lexical embedder).
default = ["cozo", "fastembed", "http"]
cozo = ["mneme-cozo/cozo"]
fastembed = ["mneme-embed/fastembed", "mneme-library/fast-rerank"]
# Streamable-HTTP transport (`--http ADDR`) so a chat connector can reach it.
http = ["dep:axum", "tokio/signal"]
