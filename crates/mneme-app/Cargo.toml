[package]
name = "mneme-app"
version = "0.1.0"
edition = "2024"
description = "Shared application operations for Mneme frontends"
license.workspace = true
publish = false

[dependencies]
mneme-config.workspace = true
mneme-core.workspace = true
mneme-engine.workspace = true
mneme-present.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
sha2.workspace = true
ulid.workspace = true
tokio = { workspace = true, features = ["time"] }
toml_edit = { version = "0.22", features = ["serde"] }

[dev-dependencies]
mneme-cozo.workspace = true
mneme-embed.workspace = true
mneme-body.workspace = true
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
