[package]
edition = "2021"
name = "mnestic"
version = "0.13.0"
authors = [
    "Shan Rizvi",
    "Ziyang Hu (original CozoDB author)",
]
build = false
exclude = ["tests/*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A transactional relational-graph-vector database using Datalog — a maintained fork of CozoDB, tuned as a substrate for agentic memory"
readme = "README-mnestic.md"
keywords = [
    "database",
    "datalog",
    "graph",
    "vector",
    "embedded",
]
categories = [
    "database",
    "database-implementations",
]
license = "MPL-2.0"
repository = "https://github.com/shuruheel/mnestic"

[features]
compact = [
    "minimal",
    "requests",
    "graph-algo",
]
compact-single-threaded = [
    "minimal",
    "requests",
    "graph-algo",
]
cypher = []
default = ["compact"]
graph-algo = [
    "graph",
    "rayon",
]
io-uring = ["cozorocks?/io-uring"]
jemalloc = [
    "dep:tikv-jemallocator-global",
    "cozorocks?/jemalloc",
]
minimal = [
    "storage-sqlite",
    "storage-sqlite-src",
]
requests = ["dep:minreq"]
storage-new-rocksdb = ["dep:rocksdb"]
storage-rocksdb = ["dep:cozorocks"]
storage-sled = ["dep:sled"]
storage-sqlite = [
    "dep:sqlite",
    "dep:sqlite3-sys",
]
storage-sqlite-src = [
    "dep:sqlite3-src",
    "sqlite3-src/bundled",
]
storage-tikv = [
    "dep:tikv-client",
    "dep:tokio",
]
test-hooks = []
wasm = [
    "uuid/js",
    "dep:js-sys",
]

[lib]
name = "cozo"
path = "src/lib.rs"

[[bench]]
name = "graph_projection"
path = "benches/graph_projection.rs"
harness = false
required-features = ["graph-algo"]

[[bench]]
name = "point_lookup"
path = "benches/point_lookup.rs"
harness = false

[[bench]]
name = "read_path"
path = "benches/read_path.rs"
harness = false

[[bench]]
name = "time_travel"
path = "benches/time_travel.rs"
harness = false

